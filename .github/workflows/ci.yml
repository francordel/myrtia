name: CI

# NOT ACTIVE YET (intentional): this workflow only runs when triggered by hand
# (Actions tab -> CI -> "Run workflow"). It will NOT run on pushes or pull requests.
#
# To turn it on for production, uncomment the push / pull_request triggers below:
#
#   push:
#     branches: [ main ]
#   pull_request:
#     branches: [ main ]
on:
  workflow_dispatch:

jobs:
  backend-offline:
    name: Backend BDD suite (offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Only the offline tier runs in CI. The @e2e scenarios need a live
      # OpenAI-compatible endpoint (local Ollama) and are excluded here; run them
      # locally with `pytest -m e2e` against a served model.
      - name: Run offline behaviour-driven tests
        run: pytest -m "not e2e" -q
