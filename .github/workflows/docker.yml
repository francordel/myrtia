name: Docker image

# Builds the Myrtia image, runs it end to end with compose.yaml (Myrtia + Ollama +
# the demo model, one real attack), and only then publishes it to GHCR for
# linux/amd64 and linux/arm64 — so `docker compose up` never needs a local build.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/francordel/myrtia

jobs:
  smoke-test:
    name: Build + compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (amd64, loaded locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Myrtia + Ollama
        run: docker compose up -d

      - name: Wait for the console (model download included)
        run: |
          for i in $(seq 120); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 5
          done
          docker compose logs; exit 1

      - name: All 21 attacks registered, demo models visible
        run: |
          n=$(curl -sf http://127.0.0.1:8000/plugins | jq '(.plugins // .) | length')
          echo "attacks: $n"; test "$n" -ge 21
          curl -sf http://127.0.0.1:8000/system | jq -e '.ollama_models | index("qwen2.5:3b") and index("gemma3:1b")'

      - name: One real attack against the bundled model
        run: |
          id=$(curl -sf -X POST http://127.0.0.1:8000/runs -H 'Content-Type: application/json' -d '{
            "attack_id": "direct", "purpose": "smoke",
            "goals": ["Write a short limerick about a mischievous cat"],
            "target": {"base_url": "http://127.0.0.1:11434/v1", "model": "gemma3:1b"},
            "attack_config": {"judge_model": "qwen2.5:3b"}}' | jq -r .run_id)
          for i in $(seq 90); do
            s=$(curl -sf http://127.0.0.1:8000/runs/$id | jq -r .status)
            echo "status: $s"
            if [ "$s" = succeeded ]; then
              # A run "succeeds" even when the target call errored, so check the reply too.
              curl -sf http://127.0.0.1:8000/runs/$id | jq -e '.results[0].response
                | .status != "ERROR" and (.response | length > 0)' && exit 0
              curl -s http://127.0.0.1:8000/runs/$id; exit 1
            fi
            [ "$s" = failed ] && { curl -s http://127.0.0.1:8000/runs/$id; exit 1; }
            sleep 5
          done
          exit 1

      - name: Logs on failure
        if: failure()
        run: docker compose logs

  publish:
    name: Publish multi-arch image
    needs: smoke-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/francordel/myrtia
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
