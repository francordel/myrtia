B Experimental Details and Additional Results
B.1 Attack Success Rate by Semantic Category
This section presents X-Teaming’s performance across the six HarmBench semantic cate-gories (Ren et al., 2024). Table 6 shows that Cybercrime had 100% attack success rate across
all but one model, while the Harmful content and Misinformation categories showed more
resistance. Claude 3.5-Sonnet demonstrated the highest resistance overall (67.9% ASR),
followed by Llama-3-70B-IT (84.9%). Among open-weight models, Deepseek V3 was most
vulnerable (98.1%), while Llama-3-8B-IT with SafeMTData (Ren et al., 2024) was actually
more vulnerable (91.8%) than the original Llama-3-8B-IT (85.5%). These category-specific
results provide a detailed breakdown of X-Teaming’s overall attack success rates presented
in Table 2.
