B.2 Attack Efficiency Details
Table 8 presents the average resources required for successfulX-Teaming jailbreaks across
models shown in Table 2. For proprietary models, Claude 3.7 Sonnet required the most
average turns (4.95) and Llama-3-8B-IT the most TextGrad optimizations (1.40). Claude 3.5
Sonnet needed significantly more attack plans than any other model (11.0), reflecting its
stronger safety tuning. Among open-weight models, Llama-3-8B-IT used the most resources
with 4.55 turns and 1.40 TextGrad optimizations per successful attack. Deepseek V3 needed
the fewest plans (1.34) to achieve its high success rate (98.1%). Table 3.2 shows that all
attacks used only a small fraction of available context windows, with token usage ranging
from 1,647 to 5,330 tokens across models with context lengths of 8K to 1M.
