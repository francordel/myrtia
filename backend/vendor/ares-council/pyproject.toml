[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ares-council"
description = "ARES Council Attack Plugin — multi-model collaborative adversarial prompt generation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "ARES Team"},
]
license = "Apache-2.0"
dependencies = [
    # ARES core: council_attack.py imports ares.connectors / ares.strategies /
    # ares.utils, so the core package must be present. Without it, `import
    # ares_council` fails and Myrtia silently unregisters the council plugins.
    "ares-redteamer",
    "requests",
    "tqdm",
]
version = "0.1"

[tool.setuptools.packages.find]
where = ["src"]
