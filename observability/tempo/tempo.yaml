# Tempo: the trace store of Myrtia's optional observability stack (spec 009).
# Receives OpenTelemetry traces over OTLP/HTTP and keeps them in a Docker volume.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"

ingester:
  # Short blocks so a run that just finished is searchable within seconds.
  trace_idle_period: 5s
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 720h   # 30 days

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
